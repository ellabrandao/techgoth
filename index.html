<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>TECHGOTH.exe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="screen">
      <canvas id="game" aria-label="TECHGOTH.exe - jogo de corrida em ASCII"></canvas>
      <div id="namebox" style="visibility:hidden">
        <label for="name">&gt; NOME:</label>
        <input id="name" type="text" maxlength="12" placeholder="ANON"
               autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
    </div>
    <p class="hint">
      <b>[ESPAÇO]</b> / <b>[↑]</b> pular &nbsp;·&nbsp;
      <b>[↓]</b> abaixar &nbsp;·&nbsp;
      <b>[P]</b> pausar &nbsp;·&nbsp;
      <b>[M]</b> mudo &nbsp;·&nbsp;
      <b>[N]</b> trocar nome &nbsp;·&nbsp;
      toque na tela = pular, deslize pra baixo = abaixar
    </p>
  </main>

  <script src="js/sprites.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/config.js"></script>
  <script src="js/online.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
