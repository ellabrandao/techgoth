<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>TECHGOTH.exe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <p class="prompt"><span class="host">techgoth.club</span>:<span class="path">~</span>$ ./runner.exe<i class="cursor"></i></p>
    <div class="screen">
      <canvas id="game" aria-label="TECHGOTH.exe - jogo de corrida em ASCII"></canvas>
      <div id="namebox" style="visibility:hidden">
        <label for="name">&gt; NOME:</label>
        <input id="name" type="text" maxlength="12" placeholder="ANON"
               autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
    </div>
    <p class="hint keys">
      <span class="item"><kbd>ESPAÇO</kbd><kbd>↑</kbd> pular</span>
      <span class="item"><kbd>↓</kbd> abaixar</span>
      <span class="item"><kbd>P</kbd> pausar</span>
      <span class="item"><kbd>M</kbd> mudo</span>
      <span class="item"><kbd>N</kbd> trocar nome</span>
    </p>
    <p class="hint touch">
      <span class="item">toque na tela = pular</span>
      <span class="item">deslize pra baixo = abaixar</span>
    </p>
  </main>

<script src="sprites.js"></script>
<script src="audio.js"></script>
<script src="config.js"></script>
<script src="online.js"></script>
<script src="game.js"></script>
</body>
</html>
